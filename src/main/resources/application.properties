spring.application.name=mybarber
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/mybarber}
spring.datasource.username=${DB_USUARIO:postgres}
spring.datasource.password=${DB_SENHA}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_EXIBIR_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

spring.data.web.pageable.max-page-size=100

mybarber.jwt.segredo=${JWT_SEGREDO}
mybarber.jwt.expiracao=${JWT_EXPIRACAO:8h}
mybarber.jwt.emissor=mybarber
mybarber.cors.origens-permitidas=${CORS_ORIGENS:http://localhost:5173}

mybarber.administrador-inicial.nome=${ADMIN_NOME:Administrador}
mybarber.administrador-inicial.email=${ADMIN_EMAIL:}
mybarber.administrador-inicial.telefone=${ADMIN_TELEFONE:}
mybarber.administrador-inicial.senha=${ADMIN_SENHA:}

mybarber.fuso-horario=America/Sao_Paulo
mybarber.agenda.intervalo-minutos=30
mybarber.agenda.antecedencia-minima-agendamento=30m
mybarber.agenda.antecedencia-minima-cancelamento-cliente=2h
mybarber.agenda.dias-maximos-antecedencia=60

springdoc.api-docs.enabled=${DOCUMENTACAO_API_HABILITADA:true}
springdoc.swagger-ui.enabled=${DOCUMENTACAO_API_HABILITADA:true}
springdoc.swagger-ui.persist-authorization=true
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.doc-expansion=none

mybarber.autenticacao.maximo-tentativas=5
mybarber.autenticacao.tempo-bloqueio=15m

mybarber.email.habilitado=${EMAIL_HABILITADO:false}
mybarber.email.remetente=${EMAIL_REMETENTE:}
mybarber.email.nome-remetente=${EMAIL_NOME_REMETENTE:MyBarber}
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORTA:587}
spring.mail.username=${SMTP_USUARIO:}
spring.mail.password=${SMTP_SENHA:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

mybarber.redefinicao-senha.validade=30m
mybarber.redefinicao-senha.intervalo-minimo-entre-solicitacoes=1m
mybarber.redefinicao-senha.url-frontend=${FRONTEND_URL:http://localhost:5173}

mybarber.lembrete.habilitado=${LEMBRETE_HABILITADO:true}
mybarber.lembrete.antecedencia=${LEMBRETE_ANTECEDENCIA:24h}
mybarber.lembrete.antecedencia-minima-desde-criacao=3h
mybarber.lembrete.limite-diario=${LEMBRETE_LIMITE_DIARIO:300}
mybarber.lembrete.intervalo-verificacao=10m
mybarber.lembrete.url-frontend=${FRONTEND_URL:http://localhost:5173}
