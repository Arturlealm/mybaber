spring.application.name=mybarber
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/mybarber}
spring.datasource.username=${DB_USUARIO:postgres}
spring.datasource.password=${DB_SENHA}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_EXIBIR_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

spring.data.web.pageable.max-page-size=100

mybarber.jwt.segredo=${JWT_SEGREDO}
mybarber.jwt.expiracao=${JWT_EXPIRACAO:8h}
mybarber.jwt.emissor=mybarber
mybarber.cors.origens-permitidas=${CORS_ORIGENS:http://localhost:5173}

mybarber.administrador-inicial.nome=${ADMIN_NOME:Administrador}
mybarber.administrador-inicial.email=${ADMIN_EMAIL:}
mybarber.administrador-inicial.telefone=${ADMIN_TELEFONE:}
mybarber.administrador-inicial.senha=${ADMIN_SENHA:}
